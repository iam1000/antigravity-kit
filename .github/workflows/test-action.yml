name: Test Action

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run a simple test script
        run: |
          echo "🚀 Hello, GitHub Actions!"
          echo "✅ This Action is triggered automatically code is pushed to dev or main branch."
